- type: antag
  id: Nukeops
  name: roles-antag-nuclear-operative-name
  antagonist: true
  setPreference: true
  objective: roles-antag-nuclear-operative-objective
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 15h # Corvax-RoleTime 5
  - !type:DepartmentTimeRequirement
    department: Security
    time: 5h # Corvax-RoleTime
  guides: [ NuclearOperatives ]
  tags:
  - OffStation
  - Roundstart

- type: antag
  id: NukeopsMedic
  name: roles-antag-nuclear-operative-agent-name
  antagonist: true
  setPreference: true
  objective: roles-antag-nuclear-operative-agent-objective
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 15h # Corvax-RoleTime 5
  - !type:RoleTimeRequirement
    role: JobChemist
    time: 10h # Corvax-RoleTime 3
  - !type:DepartmentTimeRequirement
    department: Security
    time: 10h # Corvax-RoleTime
  guides: [ NuclearOperatives ]
  tags:
  - OffStation
  - Roundstart

- type: antag
  id: NukeopsCommander
  name: roles-antag-nuclear-operative-commander-name
  antagonist: true
  setPreference: true
  objective: roles-antag-nuclear-operative-commander-objective
  requirements:
  - !type:OverallPlaytimeRequirement
    time: 30h # Corvax-RoleTime 5
  - !type:DepartmentTimeRequirement
    department: Security
    time: 15h # Corvax-RoleTime 5
  # should be changed to nukie playtime when thats tracked (wyci)
  guides: [ NuclearOperatives ]
  tags:
  - OffStation
  - Roundstart

- type: antagSpecifier
  abstract: true
  parent: RestrictedAntag
  id: BaseNukeops
  prefRoles:
  - GenericTeamAntagonist # For antag ban purposes
  roleLoadout:
  - RoleSurvivalNukie
  components:
  - type: NukeOperative
  - type: NpcFactionMember
    factions:
    - Syndicate

- type: antagSpecifier
  parent: BaseNukeops
  id: NukeopsCommander
  prefRoles:
  - NukeopsCommander
  spawnerPrototype: SpawnPointNukeopsCommander
  # Genesis-Start: The selected kit includes the required survival groups itself.
  roleLoadout:
  - NukeopsCommander
  # Genesis-End
  startingGear: SyndicateCommanderGearFull
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateElite
    nameFormat: name-format-nukie-commander
  mindRoles:
  - MindRoleNukeopsCommander

- type: antagSpecifier
  parent: BaseNukeops
  id: NukeopsMedic
  prefRoles:
  - NukeopsMedic
  spawnerPrototype: SpawnPointNukeopsMedic
  # Genesis-Start: The selected kit includes the required survival groups itself.
  roleLoadout:
  - NukeopsMedic
  # Genesis-End
  startingGear: SyndicateOperativeMedicFull
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-agent
  mindRoles:
  - MindRoleNukeopsMedic

- type: antagSpecifier
  parent: BaseNukeops
  id: NukeopsOperative
  prefRoles:
  - Nukeops
  spawnerPrototype: SpawnPointNukeopsOperative
  # Genesis-Start: The selected kit includes the required survival groups itself.
  roleLoadout:
  - Nukeops
  # Genesis-End
  startingGear: SyndicateOperativeGearFull
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-operator
  mindRoles:
  - MindRoleNukeops

- type: antagSpecifier
  parent: BaseNukeops
  id: LoneOp
  spawnerPrototype: SpawnPointLoneNukeOperative
  pickPlayer: false
  roleLoadout:
  - Nukeops # Reuse the selected operative kit and name.
  startingGear: SyndicateLoneOperativeGearFull
  components:
  - type: RandomMetadata
    nameSegments:
    - NamesSyndicatePrefix
    - NamesSyndicateNormal
    nameFormat: name-format-nukie-generic
  mindRoles:
  - MindRoleLoneops

- type: startingGear
  id: SyndicateOperativeGearFullNoUplink
  equipment:
    #jumpsuit: ClothingUniformJumpsuitOperative
    #back: ClothingBackpackDuffelSyndicate
    mask: ClothingMaskGasSyndicate
    eyes: ClothingEyesHudSyndicate
    ears: ClothingHeadsetAltSyndicate
    gloves: ClothingHandsGlovesCombat
    shoes: ClothingShoesBootsMagSyndie
    id: SyndiOperativePDA
    pocket2: PlushieCarp
    belt: ClothingBeltMilitaryWebbing
  # No inhand key here: a comment-only inhand block becomes YAML null and breaks inheritance.
  storage:
    back:
    - WeaponPistolViper
    - PinpointerSyndicateNuclear
    - DeathAcidifierImplanter

#Nuclear Operative Gear
- type: startingGear
  id: SyndicateOperativeGearFull
  parent: SyndicateOperativeGearFullNoUplink
  equipment:
    pocket2: BaseUplinkRadio40TC

- type: chameleonOutfit
  id: NukeopsOutfit
  name: roles-antag-nuclear-operative-name
  startingGear: SyndicateOperativeGearFullNoUplink
  icon: "JobIconSyndicateOperative"
  equipment:
    head: ClothingHeadHelmetHardsuitSyndie
    neck: ClothingNeckScarfStripedSyndieRed

#Nuclear Operative Commander Gear
- type: startingGear
  id: SyndicateCommanderGearFull
  parent: SyndicateOperativeGearFull
  equipment:
    #id: SyndiCommanderPDA
    neck: SyndicateWhistle
  inhand:
  - NukeOpsDeclarationOfWar
  #- CommanderHardsuitCaseSyndicate

- type: chameleonOutfit
  id: NukeopsCommanderOutfit
  name: roles-antag-nuclear-operative-commander-name
  startingGear: SyndicateCommanderGearFull
  icon: "JobIconSyndicateCommander"
  equipment:
    head: ClothingHeadHelmetHardsuitSyndieCommander
    neck: ClothingNeckScarfStripedSyndieGreen

#Nuclear Operative Medic Gear
- type: startingGear
  id: SyndicateOperativeMedicFull
  parent: SyndicateOperativeGearFull
  equipment:
    eyes: ClothingEyesHudSyndicateAgent
    id: SyndiCorpsmanPDA
    belt: ClothingBeltMilitaryWebbingMedFilled
  storage:
    back:
    - SyndiHypo
    - SawAdvanced
    - Cautery
    - CombatKnife
    - WeaponPistolViper
    - PinpointerSyndicateNuclear
    - HandheldHealthAnalyzer
    - CombatMedipen
    - DeathAcidifierImplanter

- type: chameleonOutfit
  id: NukeopsMedicOutfit
  name: roles-antag-nuclear-operative-agent-name
  startingGear: SyndicateOperativeMedicFull
  icon: "JobIconSyndicateCorpsman"
  equipment:
    head: ClothingHeadHelmetHardsuitSyndieMedic
    neck: ClothingNeckScarfStripedLightBlue

#Lone Operative Gear
