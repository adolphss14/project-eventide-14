- type: marking
  id: UmaEarsDefault
  bodyPart: HeadTop
  groupWhitelist: [Uma]
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SimpleColoring
        color: '#8B5A2B'
  sprites:
  - name: marking-UmaEarsDefault-outer
    sprite: _Eventide/Mobs/Customization/uma_ears.rsi
    state: ears_uma_outer
  - name: marking-UmaEarsDefault-inner
    sprite: _Eventide/Mobs/Customization/uma_ears.rsi
    state: ears_uma_inner
    coloring:
      type: !type:SimpleColoring
        color: '#FFFFFF'

- type: marking
  id: UmaTailDefault
  bodyPart: Tail
  groupWhitelist: [Uma]
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SimpleColoring
        color: '#8B5A2B'
  sprites:
  - name: marking-UmaTailDefault-outer
    sprite: _Eventide/Mobs/Customization/uma_tails.rsi
    state: tail_uma_wag
  - name: marking-UmaTailDefault-inner
    sprite: _Eventide/Mobs/Customization/uma_tails.rsi
    state: tail_uma_wag_inner
    coloring:
      type: !type:SimpleColoring
        color: '#FFFFFF'
