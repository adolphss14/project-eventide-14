- type: marking
  id: UmaEarsDefault
  bodyPart: HeadTop
  forcedColoring: true
  groupWhitelist: [Uma]
  coloring:
    default:
      type: !type:CategoryColoring
        category: Hair
      fallbackTypes:
      - !type:SkinColoring {}
  sprites:
  - sprite: _Eventide/Mobs/Customization/uma_ears.rsi
    state: ears_uma_outer
  - sprite: _Eventide/Mobs/Customization/uma_ears.rsi
    state: ears_uma_inner
    coloring:
      type: !type:SimpleColoring
        color: '#FFFFFF'

- type: marking
