- type: entity
  parent: AppearanceHuman
  id: AppearanceFelinid
  categories: [ HideSpawnMenu ]
  name: felinid appearance
  components:
  - type: HumanoidProfile
    species: Felinid
  # Give Felinid external organs their own markings group so the legacy
  # ears/tail defaults and the Felinid-specific slot limits remain active.
  - type: InitialBody
    organs:
      Torso: OrganFelinidTorso
      Head: OrganFelinidHead
      ArmLeft: OrganFelinidArmLeft
      ArmRight: OrganFelinidArmRight
      HandRight: OrganFelinidHandRight
      HandLeft: OrganFelinidHandLeft
      LegLeft: OrganFelinidLegLeft
      LegRight: OrganFelinidLegRight
      FootLeft: OrganFelinidFootLeft
      FootRight: OrganFelinidFootRight
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      Ears: OrganHumanEars
      Lungs: OrganHumanLungs
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      Kidneys: OrganHumanKidneys

- type: entity
  save: false
  name: Urist McFelinid
  parent:
  - AppearanceFelinid
  - BaseSpeciesMobOrganic
  id: MobFelinidBase
  abstract: true
  components:
  - type: Sprite
    scale: 0.8, 0.8
  # Current Eventide stores humanoid species on HumanoidProfileComponent.
  - type: HumanoidProfile
    species: Felinid
  - type: Fixtures
    fixtures: # TODO: This needs a second fixture just for mob collisions.
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.28
        density: 140
        restitution: 0.0
        mask:
        - MobMask
        layer:
        - MobLayer
  - type: Damageable
  - type: MeleeWeapon
    hidden: true
    soundHit:
      collection: Punch
    angle: 30
    animation: WeaponArcClaw
    attackRate: 1
    damage:
      types:
        Blunt: 1
        Slash: 5
  - type: Thieving
    stealthy: true
    stripTimeReduction: 1
  - type: Speech
    speechSounds: Alto
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 1
    soundHit:
      path: /Audio/Effects/hit_kick.ogg
  - type: Stamina
    baseCritThreshold: 85
  - type: WoundLicking
  - type: OwOAccent
  - type: Vocal
  - type: Felinid
  - type: Respirator
    damage:
      types:
        Asphyxiation: 1.5
    damageRecovery:
      types:
        Asphyxiation: -1.5
  - type: NpcFactionMember
    factions:
      - NanoTrasen
  - type: InteractionPopup
    successChance: 1
    interactSuccessString: hugging-success-generic
    interactSuccessSound: /Audio/Effects/thudswoosh.ogg
    messagePerceivedByOthers: hugging-success-generic-others
  - type: MovementSpeedModifier
    baseSprintSpeed: 4.0
    baseWalkSpeed: 2.0

#Nya~~

# Felinid external organs use the Felinid markings group instead of the human group.
- type: entity
  parent: OrganHumanExternal
  id: OrganFelinidExternal
  abstract: true
  components:
  - type: VisualOrganMarkings
    markingData:
      group: Felinid

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganFelinidExternal ]
  id: OrganFelinidTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganFelinidExternal ]
  id: OrganFelinidHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair

- type: entity
  parent: [ OrganBaseArmLeft, OrganFelinidExternal ]
  id: OrganFelinidArmLeft

- type: entity
  parent: [ OrganBaseArmRight, OrganFelinidExternal ]
  id: OrganFelinidArmRight

- type: entity
  parent: [ OrganBaseHandLeft, OrganFelinidExternal ]
  id: OrganFelinidHandLeft

- type: entity
  parent: [ OrganBaseHandRight, OrganFelinidExternal ]
  id: OrganFelinidHandRight

- type: entity
  parent: [ OrganBaseLegLeft, OrganFelinidExternal ]
  id: OrganFelinidLegLeft

- type: entity
  parent: [ OrganBaseLegRight, OrganFelinidExternal ]
  id: OrganFelinidLegRight

- type: entity
  parent: [ OrganBaseFootLeft, OrganFelinidExternal ]
  id: OrganFelinidFootLeft

- type: entity
  parent: [ OrganBaseFootRight, OrganFelinidExternal ]
  id: OrganFelinidFootRight
