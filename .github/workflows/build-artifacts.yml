name: Build Artifacts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Server and Client
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Run repository build setup
        run: python3 RUN_THIS.py

      - name: Restore dependencies
        run: dotnet restore

      - name: Build packaging tool
        run: dotnet build Content.Packaging --configuration Release --no-restore /m

      # Keep the same practical platform set as the Workbench artifact pipeline.
      - name: Package server (Windows x64 and Linux x64)
        run: >
          dotnet run --project Content.Packaging
          --configuration Release
          --no-build --
          server
          --platform win-x64
          --platform linux-x64

      # The packaging command wipes release/ by default. Keep the server ZIPs.
      - name: Package client
        run: >
          dotnet run --project Content.Packaging
          --configuration Release
          --no-build --
          client
          --no-wipe-release

      - name: Verify generated packages
        shell: bash
        run: |
          set -euo pipefail
          test -s release/SS14.Server_win-x64.zip
          test -s release/SS14.Server_linux-x64.zip
          test -s release/SS14.Client.zip
          ls -lh release/SS14.Server_*.zip release/SS14.Client.zip

      - name: Upload server artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS14.Server_${{ github.sha }}
          path: |
            release/SS14.Server_win-x64.zip
            release/SS14.Server_linux-x64.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload client artifact
        uses: actions/upload-artifact@v4
        with:
          name: SS14.Client_${{ github.sha }}
          path: release/SS14.Client.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
