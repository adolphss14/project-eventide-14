name: One-time wireless map migration

on:
  push:
    branches:
      - master
    paths:
      - ".github/mapfix-trigger.txt"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Migrate saved map components and remove temporary workaround
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          old = b"type: WirelessNetworkConnection"
          new = b"type: WirelessNetwork"
          total = 0
          changed = []

          for path in Path("Resources/Maps").rglob("*"):
              if not path.is_file() or path.suffix.lower() not in {".yml", ".yaml"}:
                  continue
              data = path.read_bytes()
              count = data.count(old)
              if count:
                  path.write_bytes(data.replace(old, new))
                  total += count
                  changed.append((str(path), count))

          for path, count in changed:
              print(f"{path}: replaced {count} legacy component reference(s)")
          print(f"Total map references migrated: {total}")
          if total < 5:
              raise SystemExit(f"Expected at least 5 legacy references, found {total}")

          system = Path("Content.Shared/DeviceNetwork/Systems/WirelessNetworkSystem.cs")
          data = system.read_bytes()
          method = (
              b"    [SubscribeLocalEvent]\n"
              b"    private void OnLegacyWirelessNetworkMapInit(Entity<WirelessNetworkConnectionComponent> ent, ref MapInitEvent args)\n"
              b"    {\n"
              b"        var wireless = EnsureComp<WirelessNetworkComponent>(ent.Owner);\n"
              b"        wireless.Range = ent.Comp.Range;\n"
              b"\n"
              b"        // Convert older saved maps to the current component name and schema at load time.\n"
              b"        RemCompDeferred<WirelessNetworkConnectionComponent>(ent.Owner);\n"
              b"    }\n"
              b"\n"
          )
          if method not in data:
              raise SystemExit("Expected temporary compatibility method was not found; refusing to commit")
          system.write_bytes(data.replace(method, b"", 1))

          legacy = Path("Content.Shared/DeviceNetwork/Components/WirelessNetworkConnectionComponent.cs")
          if not legacy.exists():
              raise SystemExit("Expected temporary compatibility component was not found")
          legacy.unlink()

          Path(".github/workflows/tmp-fix-wireless-map-components.yml").unlink()
          Path(".github/mapfix-trigger.txt").unlink()
          PY

          git add -A -- Resources/Maps Content.Shared/DeviceNetwork/Systems/WirelessNetworkSystem.cs Content.Shared/DeviceNetwork/Components/WirelessNetworkConnectionComponent.cs .github/workflows/tmp-fix-wireless-map-components.yml .github/mapfix-trigger.txt
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix legacy wireless component names in maps"
          git push origin HEAD:master
